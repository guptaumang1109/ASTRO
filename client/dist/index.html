    <script>
      (function() {
        const theme = localStorage.getItem('theme') || 'dark';

        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

        margin: 0;
        transition: background-color 0.3s ease;
      }
      :root:not(.dark) .initial-loader {
